    <style>
      /* Lightbox Styles */
      .lightbox {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9);
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      .lightbox img {
        max-width: 80%;
        max-height: 80%;
        border-radius: 8px;
      }

      .lightbox .close {
        position: absolute;
        top: 20px; right: 30px;
        color: white;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
      }

      .lightbox .prev, .lightbox .next {
        position: absolute;
        top: 50%;
        color: white;
        font-size: 40px;
        cursor: pointer;
        user-select: none;
      }

      .lightbox .prev { left: 50px; }
      .lightbox .next { right: 50px; }

      #project-images img {
        cursor: pointer;
        max-width: 50%;
        border-radius: 10px;
      }
    </style>

    <script>
      const images = document.querySelectorAll('#project-images img');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightbox-image');
      let currentIndex = 0;

      function openLightbox(index) {
        currentIndex = index;
        lightbox.style.display = 'flex';
        lightboxImage.src = images[currentIndex].src;
      }

      function closeLightbox() {
        lightbox.style.display = 'none';
      }

      function nextImage(event) {
        event.stopPropagation();
        currentIndex = (currentIndex + 1) % images.length;
        lightboxImage.src = images[currentIndex].src;
      }

      function prevImage(event) {
        event.stopPropagation();
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        lightboxImage.src = images[currentIndex].src;
      }
      document.addEventListener('keydown', (e) => {
      if (lightbox.style.display === 'flex') {  // Only work if lightbox is open
        if (e.key === 'ArrowRight') {
          currentIndex = (currentIndex + 1) % images.length;  // Go to next image (loop back to first)
          lightboxImage.src = images[currentIndex].src;  // Update lightbox image
        } else if (e.key === 'ArrowLeft') {
          currentIndex = (currentIndex - 1 + images.length) % images.length;  // Go to previous image (loop back to last)
          lightboxImage.src = images[currentIndex].src;  // Update lightbox image
        } else if (e.key === 'Escape') {
          closeLightbox();  // Close the lightbox if Escape is pressed
        }
      }
    });
    </script>
