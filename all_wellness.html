    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <link

    />
    <script

    <style>
      /* Lightbox Styles */
      .lightbox {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9);
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      .lightbox img {
        max-width: 80%;
        max-height: 80%;
        border-radius: 8px;
      }

      .lightbox .close {
        position: absolute;
        top: 20px; right: 30px;
        color: white;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
      }

      .lightbox .prev, .lightbox .next {
        position: absolute;
        top: 50%;
        color: white;
        font-size: 40px;
        cursor: pointer;
        user-select: none;
      }

      .lightbox .prev { left: 50px; }
      .lightbox .next { right: 50px; }

      #project-images img {
        cursor: pointer;
        max-width: 50%;
        border-radius: 10px;
      }
    </style>
  </head>

      <!--logo-->

              alt="logo img"
              width="100"
              height="100"
            />
          </a>
          <nav>
            <ul class="navigation">
              <li><a href="index.html">Home</a></li>
              <li class="dropdown">
                <a href="javascript:void(0);" onclick="this.nextElementSibling.classList.toggle('show')">
                  Services <span class="arrow">▼</span>
                </a>
                <div class="dropdown-menu">
                  <div class="service-item"><a href="photography.html">Photography</a></div>
                  <div class="service-item"><a href="videography.html">Videography</a></div>
                  <div class="service-item"><a href="visual-design.html">Visual Design</a></div>
                  <div class="service-item"><a href="vintage-focus-portraits.html">Vintage Focus Portraits</a></div>
                </div>
              </li>
              <li><a href="about.html">About</a></li>
              <li><a href="contact-me.html">Contact</a></li>

                <a

    <main>
      <div id="project-images">
        <div>
          <h2>All Wellness</h2>
          <img src="img/all_wellness/ALL_Wellness_case_study_1200.jpg" onclick="openLightbox(0)" style="max-width: 50%; cursor: pointer;" alt="Profile Image" />
          <img src="img/all_wellness/Color_Palette_1200.jpg" onclick="openLightbox(1)" style="max-width: 50%; cursor: pointer;" alt="Profile Image" />
          <img src="img/all_wellness/Cell_phone_Mockup_1200.jpg" onclick="openLightbox(2)" style="max-width: 50%; cursor: pointer;" alt="Profile Image" />
          <img src="img/all_wellness/typography_Logo_1200.jpg" onclick="openLightbox(3)" style="max-width: 50%; cursor: pointer;" alt="Profile Image" />
          <img src="img/all_wellness/Computer_mock_up_1200.jpg" onclick="openLightbox(4)" style="max-width: 50%; cursor: pointer;" alt="Profile Image" />
        </div>
      </div>
      <div>
        <a href="ux_ui_plus_web.html" class="button">Back to UX/UI &amp; Webdesign</a>
      </div>

       <!-- Lightbox -->
       <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close">&times;</span>
        <img id="lightbox-image" alt="Zoomed Image">
        <div class="prev" onclick="prevImage(event)">&#10094;</div>
        <div class="next" onclick="nextImage(event)">&#10095;</div>
      </div>
    </main>
    <footer>
      <div id="copyright">
        <p>Copyright JAKE-KRAUS 2024</p>
      </div>
    </footer>
    <script>
      const images = document.querySelectorAll('#project-images img');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightbox-image');
      let currentIndex = 0;

      function openLightbox(index) {
        currentIndex = index;
        lightbox.style.display = 'flex';
        lightboxImage.src = images[currentIndex].src;
      }

      function closeLightbox() {
        lightbox.style.display = 'none';
      }

      function nextImage(event) {
        event.stopPropagation();
        currentIndex = (currentIndex + 1) % images.length;
        lightboxImage.src = images[currentIndex].src;
      }

      function prevImage(event) {
        event.stopPropagation();
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        lightboxImage.src = images[currentIndex].src;
      }
      document.addEventListener('keydown', (e) => {
      if (lightbox.style.display === 'flex') {  // Only work if lightbox is open
        if (e.key === 'ArrowRight') {
          currentIndex = (currentIndex + 1) % images.length;  // Go to next image (loop back to first)
          lightboxImage.src = images[currentIndex].src;  // Update lightbox image
        } else if (e.key === 'ArrowLeft') {
          currentIndex = (currentIndex - 1 + images.length) % images.length;  // Go to previous image (loop back to last)
          lightboxImage.src = images[currentIndex].src;  // Update lightbox image
        } else if (e.key === 'Escape') {
          closeLightbox();  // Close the lightbox if Escape is pressed
        }
      }
    });
    </script>
    <script
      src="https://code.jquery.com/jquery-3.3.1.min.js"

      crossorigin="anonymous"
    ></script>
    <script src="js/scripts.js"></script>
